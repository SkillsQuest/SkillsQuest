name: 功能建议 / Feature request
description: 想要某个功能 / Something is missing
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        中文或英文都可以。 / Chinese or English is fine.

  - type: textarea
    id: problem
    attributes:
      label: 想解决什么问题 / What problem are you running into
      description: 先说卡在哪，不用直接说功能怎么做
    validations:
      required: true

  - type: textarea
    id: idea
    attributes:
      label: 你希望它怎么工作 / How you'd like it to work
    validations:
      required: false

  - type: dropdown
    id: platform
    attributes:
      label: 主要在哪个端用 / Where you mostly use it
      options:
        - macOS
        - Windows
        - Linux
        - Android
        - iOS
        - 浏览器 / Browser
    validations:
      required: false

name: 报告缺陷 / Bug report
description: 用着有问题 / Something is broken
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        中文或英文都可以。请不要在公开 issue 里写帐号、手机号、付款信息。
        Chinese or English is fine. Don't put account details, phone numbers or payment info here.

  - type: input
    id: version
    attributes:
      label: 版本 / Version
      description: 在 设置 页底部能看到，或者写下载的文件名
      placeholder: "0.5.0"
    validations:
      required: true

  - type: dropdown
    id: platform
    attributes:
      label: 平台 / Platform
      options:
        - macOS
        - Windows
        - Linux
        - Android
        - iOS
        - 浏览器 / Browser
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: 怎么复现 / Steps to reproduce
      description: 一步一步写，最后一步是出问题的那一下
      placeholder: |
        1. 打开某棵树
        2. 点编辑
        3. ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: 本该怎样 / Expected
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: 实际怎样 / What happened
    validations:
      required: true

  - type: textarea
    id: extra
    attributes:
      label: 截图或录屏 / Screenshots
      description: 直接把文件拖进这个框
